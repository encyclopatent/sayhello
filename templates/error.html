<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Content-Style-Type" content="text/css">
  <title>错误信息</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <style>
    /* 错误页面特定样式 */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }
    
    h1 {
      color: var(--primary-color);
      margin-bottom: 30px;
    }
    
    .error-message {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 8px;
      padding: 20px;
      margin: 30px 0;
      color: #856404;
      font-size: 18px;
    }
    
    .btn {
      display: inline-block;
      background-color: var(--primary-color);
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }
    
    .btn:hover {
      background-color: var(--primary-dark);
    }
    
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--primary-color);
      text-decoration: none;
      font-weight: bold;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚠️ 操作失败</h1>
    <div class="error-message">
      {{ message }}
    </div>
    <a href="{{ url_for('alignment.index') }}" class="btn">返回序列比对页面</a>
    <br>
    <a href="{{ url_for('main.index') }}" class="back-link">← 返回工具列表</a>
  </div>
</body>
</html>
