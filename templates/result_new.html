<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>处理结果 - ST26模块</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
    <style>
        .progress-container {
            margin: 20px 0;
        }
        .progress {
            height: 25px;
        }
        .status-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin: 15px 0;
        }
        .hidden {
            display: none;
        }
        .reminder-box {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            padding: 15px;
            margin: 15px 0;
        }
        .reminder-title {
            color: #856404;
            margin-bottom: 10px;
        }
        .reminder-item {
            color: #856404;
            margin: 5px 0;
        }
        .sequence-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .sequence-table th,
        .sequence-table td {
            border: 1px solid #dee2e6;
            padding: 8px;
            text-align: left;
        }
        .sequence-table th {
            background-color: #e9ecef;
        }
        .xml-download {
            display: inline-block;
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin: 10px 0;
        }
        .xml-download:hover {
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2>ST26模块 - 处理结果</h2>
                <hr>
                
                <!-- 任务状态区域 -->
                <div id="task-status" class="status-box">
                    <div class="progress-container">
                        <div class="progress" id="progress-bar">
                            <div class="progress-bar" role="progressbar" style="width: 0%">0%</div>
                        </div>
                        <div id="progress-status" class="mt-2">准备中...</div>
                    </div>
                    
                    <!-- 任务进度区域（默认隐藏） -->
                    <div id="task-progress" class="progress-container hidden">
                        <div class="progress">
                            <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
                        </div>
                        <div id="task-progress-status" class="mt-2">处理中...</div>
                    </div>
                </div>
                
                <!-- 错误信息区域（默认隐藏） -->
                <div id="conversion-error" class="alert alert-danger hidden">
                    <h4>转换失败</h4>
                    <div id="error-message">未知错误</div>
                </div>
                
                <!-- 清除按钮 -->
                <div class="text-center mt-3">
                    <button id="clear-all-btn" class="btn btn-secondary">清除所有数据</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取任务ID
            const taskId = "{{ task_id }}";
            
            // 获取DOM元素
            const progressBar = document.getElementById('progress-bar');
            const progressStatus = document.getElementById('progress-status');
            const taskProgress = document.getElementById('task-progress');
            const taskProgressStatus = document.getElementById('task-progress-status');
            const conversionError = document.getElementById('conversion-error');
            const errorMessage = document.getElementById('error-message');
            const clearAllBtn = document.getElementById('clear-all-btn');
            
            // 下载状态标记
            let isDownloading = false;
            
            // 添加清除按钮点击事件
            if (clearAllBtn) {
                clearAllBtn.addEventListener('click', function() {
                    if (confirm('确定要清除所有数据吗？这将删除当前上传的文件和转换结果。')) {
                        clearAllBtn.disabled = true;
                        clearAllBtn.textContent = '清除中...';
                        
                        fetch('/clear_all', {
                            method: 'POST',
                            credentials: 'include'
                        })
                        .then(function(response) {
                            if (!response.ok) {
                                throw new Error('Network response was not ok');
                            }
                            return response.json();
                        })
                        .then(function(data) {
                            console.log('清除响应:', data);
                            if (data.status === 'success') {
                                window.location.href = createRelativePath('/st26');
                            } else {
                                alert('清除失败: ' + (data.message || '未知错误'));
                                clearAllBtn.disabled = false;
                                clearAllBtn.textContent = '清除所有数据';
                            }
                        })
                        .catch(function(error) {
                            console.error('清除请求出错:', error);
                            alert('清除请求失败，请稍后重试。错误: ' + error.message);
                            clearAllBtn.disabled = false;
                            clearAllBtn.textContent = '清除所有数据';
                        });
                    }
                });
            }
            
            // 监听下载链接点击事件
            document.addEventListener('click', function(e) {
                if (e.target && e.target.classList.contains('xml-download')) {
                    isDownloading = true;
                    console.log('开始下载XML文件');
                    
                    // 2秒后重置下载状态
                    setTimeout(() => {
                        isDownloading = false;
                    }, 2000);
                }
            });
            
            // 检查是否有任务ID
            if (taskId) {
                // 显示进度区域
                if (taskProgress) {
                    taskProgress.classList.remove('hidden');
                }
                
                // 轮询任务状态
                let statusInterval = null;
                
                function checkTaskStatus() {
                    fetch('/task_status/' + taskId, {
                        method: 'GET',
                        credentials: 'include'
                    })
                    .then(function(response) {
                        return response.json();
                    })
                    .then(function(data) {
                        console.log('任务状态:', data);
                        
                        if (data.state === 'PENDING') {
                            // 任务在排队中
                            if (progressStatus) {
                                progressStatus.textContent = '正在排队...';
                            }
                        } else if (data.state === 'PROGRESS') {
                            // 任务进行中
                            if (progressBar) {
                                const percent = Math.round((data.current / data.total) * 100);
                                progressBar.style.width = percent + '%';
                                progressBar.textContent = percent + '%';
                            }
                            if (progressStatus) {
                                progressStatus.textContent = '处理中... (' + data.current + '/' + data.total + ')';
                            }
                        } else if (data.state === 'SUCCESS') {
                            // 任务成功完成
                            console.log('任务完成，显示下载链接...');
                            
                            // 停止轮询
                            if (statusInterval) {
                                clearInterval(statusInterval);
                            }
                            
                            // 隐藏进度条
                            if (progressBar) {
                                progressBar.style.width = '100%';
                                progressBar.textContent = '100%';
                            }
                            
                            // 检查是否已经显示过下载链接
                            const existingDownloadSection = document.querySelector('.download-section');
                            if (existingDownloadSection) {
                                console.log('下载链接已存在，跳过重复创建');
                                return;
                            }
                            
                            // 获取XML文件信息
                            fetch('/get_xml_info?task_id=' + encodeURIComponent(taskId), {
                                method: 'GET',
                                credentials: 'include'
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.status === 'success' && data.xml_file) {
                                    // 成功获取信息，显示下载链接
                                    showDownloadSection(data);
                                } else {
                                    // 获取失败，显示查看结果按钮
                                    showViewResultButton();
                                }
                            })
                            .catch(error => {
                                console.error('获取XML信息失败:', error);
                                showViewResultButton();
                            });
                            
                        } else if (data.state === 'FAILURE') {
                            // 任务失败
                            console.log('任务失败:', data);
                            if (conversionError) {
                                conversionError.classList.remove('hidden');
                            }
                            if (errorMessage) {
                                errorMessage.textContent = data.error || '未知错误';
                            }
                            
                            // 停止轮询
                            if (statusInterval) {
                                clearInterval(statusInterval);
                            }
                        }
                    })
                    .catch(function(error) {
                        console.error('检查任务状态出错:', error);
                    });
                }
                
                // 初始检查
                checkTaskStatus();
                
                // 每2秒检查一次状态
                statusInterval = setInterval(checkTaskStatus, 2000);
            }
            
            // 显示下载链接的函数
            function showDownloadSection(data) {
                let downloadSectionHtml = `
                    <div class="status-box download-section">
                        <h4>✅ 处理完成！</h4>
                        <p><b>XML文件已成功生成</b></p>
                        <p>文件名: ${data.xml_file}</p>
                        <a href="/download_xml/${encodeURIComponent(data.xml_file)}" class="xml-download">
                            下载XML文件并删除缓存数据
                        </a>
                `;
                
                // 如果有提醒信息，添加提醒区域
                if (data.reminders && data.reminders.length > 0) {
                    downloadSectionHtml += `
                        <div class="reminder-box" style="margin-top: 15px;">
                            <h5 class="reminder-title">⚠️ 处理提醒</h5>
                            ${data.reminders.map(reminder => `<p class="reminder-item">${reminder}</p>`).join('')}
                        </div>
                    `;
                }
                
                // 如果有序列摘要，添加序列摘要区域
                if (data.sequence_summary) {
                    downloadSectionHtml += `
                        <div class="status-box" style="margin-top: 15px;">
                            <h5>序列信息摘要</h5>
                            <div class="sequence-summary">
                                <p>总序列数: ${data.sequence_summary.total_count}</p>
                                <p>DNA序列: ${data.sequence_summary.type_counts.DNA} | RNA序列: ${data.sequence_summary.type_counts.RNA} | 氨基酸序列: ${data.sequence_summary.type_counts.AA}</p>
                            </div>
                            <table class="sequence-table">
                                <thead>
                                    <tr>
                                        <th>序号</th>
                                        <th>类型</th>
                                        <th>来源</th>
                                        <th>长度</th>
                                        <th>修饰和特殊说明</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.sequence_summary.details.map(seq => `
                                        <tr>
                                            <td>${seq.id}</td>
                                            <td>${seq.type}</td>
                                            <td>${seq.organism}</td>
                                            <td>${seq.naked_length}</td>
                                            <td>${seq.modification_special_notes}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }
                
                downloadSectionHtml += '</div>';
                
                const downloadSection = document.createElement('div');
                downloadSection.innerHTML = downloadSectionHtml;
                
                // 添加到页面
                const taskStatus = document.getElementById('task-status');
                if (taskStatus && taskStatus.parentNode) {
                    taskStatus.parentNode.insertBefore(downloadSection, taskStatus.nextSibling);
                }
                
                // 更新状态文本
                if (progressStatus) {
                    progressStatus.textContent = '✅ 处理完成，点击下方下载链接获取结果';
                }
            }
            
            // 显示查看结果按钮的函数
            function showViewResultButton() {
                // 检查是否已经创建过按钮
                const existingBtn = document.querySelector('.view-result-btn');
                if (existingBtn) {
                    return;
                }
                
                if (progressStatus) {
                    progressStatus.textContent = '✅ 处理完成';
                }
                
                const viewBtn = document.createElement('button');
                viewBtn.textContent = '查看结果';
                viewBtn.className = 'btn btn-primary view-result-btn';
                viewBtn.style.marginLeft = '10px';
                
                const handleViewResult = () => {
                    window.location.reload();
                };
                
                viewBtn.onclick = handleViewResult;
                
                // 添加到状态条后面
                if (progressStatus && progressStatus.parentNode) {
                    progressStatus.parentNode.appendChild(viewBtn);
                }
            }
            
            // 页面卸载事件监听器 - 只在用户关闭页面时清除任务，而不是在页面刷新时
            let pageUnloading = false;
            
            // 检测页面是否正在刷新
            let perfEntries = performance.getEntriesByType('navigation');
            let isPageRefresh = false;
            
            if (perfEntries.length > 0 && perfEntries[0].type === 'reload') {
                isPageRefresh = true;
            }
            
            window.addEventListener('beforeunload', function(e) {
                // 如果正在下载文件，不执行清除操作
                if (isDownloading) {
                    return;
                }
                
                // 如果页面正在刷新，不清除任务
                if (isPageRefresh) {
                    return;
                }
                
                // 标记页面正在卸载
                pageUnloading = true;
                
                const taskId = "{{ task_id }}";
                const hasXmlFile = "{{ 'true' if 'xml_file' in session else 'false' }}";
                const hasTaskId = "{{ 'true' if 'task_id' in session else 'false' }}";
                
                // 只有在没有XML文件且没有任务ID且不在下载状态时才清除任务
                if (taskId && taskId !== '' && taskId !== 'null' && hasXmlFile !== 'true' && hasTaskId !== 'true' && !isDownloading) {
                    const url = '/clear_task/' + taskId;
                    
                    // 使用 sendBeacon 方法（最可靠）
                    if (navigator.sendBeacon) {
                        const data = new Blob([''], { type: 'application/x-www-form-urlencoded' });
                        navigator.sendBeacon(url, data);
                    } else {
                        // 备用方案：使用 fetch with keepalive
                        fetch(url, {
                            method: 'POST',
                            keepalive: true,
                            credentials: 'include'
                        }).catch(function(error) {
                            console.error('发送清除请求失败:', error);
                        });
                    }
                }
            });
            
            // 页面加载时检查是否是刷新
            window.addEventListener('pageshow', function(e) {
                if (e.persisted || performance.navigation.type === 1) {
                    // 页面是从缓存中恢复的或者是刷新
                    console.log('页面已刷新，不清除任务');
                }
            });
        });
    </script>
</body>
</html>
