<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Content-Style-Type" content="text/css">
  <title>序列比对工具</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <style>
    /* 序列比对页面特定样式 */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    h1 {
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 30px;
    }
    
    .description {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 40px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .form-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 30px;
      margin-bottom: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: var(--text-primary);
    }
    
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
    }
    
    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }
    
    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .form-column {
      flex: 1;
    }
    
    .algorithm-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .algorithm-option {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn {
      display: inline-block;
      background-color: var(--primary-color);
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .btn:hover {
      background-color: var(--primary-dark);
    }
    
    .btn-container {
      text-align: center;
      margin-top: 30px;
    }
    
    .results-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 30px;
      margin-top: 30px;
    }
    
    .results-container h2 {
      color: var(--primary-color);
      margin-bottom: 20px;
      text-align: center;
    }
    
    .loading {
      text-align: center;
      padding: 50px;
      color: var(--text-secondary);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    
    th, td {
      padding: 12px;
      text-align: center;
      border: 1px solid #ddd;
    }
    
    th {
      background-color: var(--primary-light);
      color: var(--primary-color);
      font-weight: bold;
    }
    
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    
    .highlight {
      background-color: #fff3cd;
      font-weight: bold;
    }
    
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--primary-color);
      text-decoration: none;
      font-weight: bold;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div class="container">
    <a href="{{ url_for('main') }}" class="back-link">← 返回工具列表</a>
    
    <h1>🧬 序列比对工具</h1>
    <p class="description">
      进行序列比对分析，支持多种比对算法，可查看序列同一性和特定位点匹配情况。靶序列为权利要求中限定的参比序列，特定位点为权利要求限定的位点，算法将特定位点匹配至查询序列，从而可以判断查询序列中的关键位点是否落入权利要求。如果不输入任何位点，则只进行序列同一性计算。
    </p>
    
    <!-- 输入表单 -->
    <div class="form-container">
      <form id="alignment-form">
        <div class="form-row">
          <div class="form-column">
            <div class="form-group">
              <label for="target-sequence">靶序列</label>
              <textarea id="target-sequence" name="target_sequence" placeholder="请输入靶序列..."></textarea>
            </div>
          </div>
          <div class="form-column">
            <div class="form-group">
              <label for="query-sequence">查询序列</label>
              <textarea id="query-sequence" name="query_sequence" placeholder="请输入查询序列..."></textarea>
            </div>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-column">
            <div class="form-group">
              <label for="target-sites">特定位点 (逗号分隔，如：266,389,422)</label>
              <input type="text" id="target-sites" name="target_sites" placeholder="请输入特定位点...">
            </div>
          </div>
          <div class="form-column">
            <div class="form-group">
              <label for="key-positions">关键位点 (逗号分隔，如：266,389,422)</label>
              <input type="text" id="key-positions" name="key_positions" placeholder="请输入关键位点...">
            </div>
          </div>
        </div>
        


        <div class="btn-container">
          <button type="submit" class="btn">开始比对</button>
        </div>
      </form>
    </div>
    
    <!-- 结果展示区域 -->
    <div class="results-container" id="results-container" style="display: none;">
      <h2>比对结果</h2>
      <div class="btn-container" style="margin-bottom: 20px;">
        <a href="{{ url_for('alignment_download_excel') }}" class="btn" id="download-excel-btn" style="margin-right: 10px;" target="_blank">下载Excel结果</a>
        <a href="{{ url_for('alignment_download_needle') }}" class="btn" id="download-needle-btn" target="_blank">下载Needle原始结果</a>
      </div>
      <div id="results-content">
        <!-- 结果将通过JavaScript动态填充 -->
      </div>
    </div>
    
    <!-- 加载状态 -->
    <div class="results-container" id="loading-container" style="display: none;">
      <div class="loading">
        <p>正在进行序列比对，请稍候...</p>
      </div>
    </div>
  </div>
  
  <script>
    $(document).ready(function() {
      // 初始隐藏下载按钮
      $('#download-excel-btn, #download-needle-btn').hide();
      
      // 表单提交处理
      $('#alignment-form').submit(function(e) {
        e.preventDefault();
        
        // 显示加载状态
        $('#results-container').hide();
        $('#loading-container').show();
        
        // 获取表单数据
        var formData = {
          target_sequence: $('#target-sequence').val().trim().toUpperCase().replace(/\s+/g, ''),
          query_sequence: $('#query-sequence').val().trim().toUpperCase().replace(/\s+/g, ''),
          target_sites: $('#target-sites').val().trim(),
          key_positions: $('#key-positions').val().trim()
        };
        
        // 验证输入
        if (!formData.target_sequence || !formData.query_sequence) {
          alert('请输入靶序列和查询序列');
          $('#loading-container').hide();
          return;
        }
        
        // 发送AJAX请求
        $.ajax({
          url: '{{ url_for('alignment_analyze') }}',
          type: 'POST',
          data: formData,
          dataType: 'json',
          success: function(response) {
            // 隐藏加载状态
            $('#loading-container').hide();
            
            if (response.status === 'success') {
              // 显示结果和下载按钮
              $('#results-container').show();
              $('#download-excel-btn, #download-needle-btn').show();
              displayResults(response.results);
            } else {
              // 显示错误信息，隐藏下载按钮
              $('#results-container').show();
              $('#download-excel-btn, #download-needle-btn').hide();
              $('#results-content').html('<p style="color: red; text-align: center;">' + response.message + '</p>');
            }
          },
          error: function(xhr, status, error) {
            // 隐藏加载状态
            $('#loading-container').hide();
            
            // 显示错误信息，隐藏下载按钮
            $('#results-container').show();
            $('#download-excel-btn, #download-needle-btn').hide();
            $('#results-content').html('<p style="color: red; text-align: center;">比对失败：' + error + '</p>');
          }
        });
      });
      
      // 显示结果
      function displayResults(results) {
        var html = '<table>';
        html += '<thead>';
        html += '<tr>';
        html += '<th>参考位点</th>';
        html += '<th>全局</th>';
        html += '<th>局部</th>';
        html += '<th>ClustalW</th>';
        html += '<th>needle</th>';
        html += '<th>MUSCLE</th>';
        html += '<th>water</th>';
        html += '<th>关键位点</th>';
        html += '</tr>';
        html += '</thead>';
        html += '<tbody>';
        
        // 遍历结果
        results.forEach(function(result) {
          html += '<tr>';
          html += '<td>' + result['参考位点'] + '</td>';
          html += '<td>' + result['全局匹配'] + '</td>';
          html += '<td>' + result['局部匹配'] + '</td>';
          html += '<td>' + result['ClustalW匹配'] + '</td>';
          html += '<td>' + result['needle匹配'] + '</td>';
          html += '<td>' + result['MUSCLE匹配'] + '</td>';
          html += '<td>' + result['water匹配'] + '</td>';
          html += '<td' + (result['关键位点'] !== '-' ? ' class="highlight"' : '') + '>' + result['关键位点'] + '</td>';
          html += '</tr>';
        });
        
        html += '</tbody>';
        html += '</table>';
        
        $('#results-content').html(html);
      }
    });
    </script>
</body>
</html>
